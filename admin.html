<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>清郁 CRM｜管理者登入</title>
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #1f3428;
      --green-800: #2f4b38;
      --green-700: #47684f;
      --green-600: #688768;
      --green-100: #eef4ea;
      --cream: #fbf7ef;
      --cream-2: #f5eee1;
      --gold: #b9915a;
      --brown: #6f543d;
      --ink: #263126;
      --muted: #6f766d;
      --white: #ffffff;
      --danger: #b85b51;
      --shadow: 0 24px 70px rgba(34, 56, 38, .13);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;
      --max: 1180px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background:
        linear-gradient(120deg, rgba(251,247,239,.96), rgba(245,238,225,.90)),
        url('images/bg.png') center / cover fixed no-repeat;
      font-family: "Noto Sans TC", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.65;
    }
    a { color: inherit; text-decoration: none; }
    button, input, textarea, select { font: inherit; }
    .hidden { display: none !important; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: 18px 24px;
      background: rgba(255, 252, 244, .84);
      backdrop-filter: blur(18px);
      border-bottom: 1px solid rgba(104,135,104,.16);
    }
    .topbar-inner {
      width: min(100%, var(--max));
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: "Noto Serif TC", serif;
      font-weight: 700;
      letter-spacing: .08em;
      color: var(--green-900);
    }
    .brand-mark {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--green-700), #d9c291);
      display: grid; place-items: center;
      color: white;
      box-shadow: 0 8px 20px rgba(71,104,79,.28);
    }
    .brand small { display: block; margin-top: -5px; font-family: "Noto Sans TC", sans-serif; font-size: 10px; letter-spacing: .24em; color: var(--green-600); }
    .top-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 44px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(47,75,56,.18);
      background: rgba(255,255,255,.68);
      color: var(--green-800);
      font-weight: 700;
      cursor: pointer;
      transition: .2s ease;
    }
    .btn:hover { transform: translateY(-1px); box-shadow: 0 12px 26px rgba(47,75,56,.12); }
    .btn-primary { background: var(--green-800); color: white; box-shadow: 0 14px 30px rgba(47,75,56,.22); }
    .btn-primary:hover { background: var(--green-900); }
    .btn-danger { background: #f8ece8; color: var(--danger); }
    .btn-small { min-height: 36px; padding: 7px 12px; font-size: 14px; }

    .login-shell {
      min-height: calc(100vh - 77px);
      display: grid;
      place-items: center;
      padding: 38px 20px;
    }
    .login-card {
      width: min(100%, 440px);
      padding: 34px;
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,.86);
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.82);
    }
    h1, h2, h3, h4 { font-family: "Noto Serif TC", serif; color: var(--green-900); margin: 0; line-height: 1.25; }
    .login-card h1 { font-size: 32px; text-align: center; }
    .login-card p { color: var(--muted); text-align: center; margin: 10px 0 26px; }
    label { display: block; color: var(--green-800); font-weight: 700; margin: 0 0 7px; font-size: 14px; }
    input, select, textarea {
      width: 100%;
      border: 1px solid rgba(104,135,104,.25);
      background: #fbfaf5;
      border-radius: 15px;
      padding: 13px 14px;
      color: var(--ink);
      outline: none;
    }
    textarea { min-height: 92px; resize: vertical; }
    input:focus, select:focus, textarea:focus { border-color: var(--green-600); box-shadow: 0 0 0 4px rgba(104,135,104,.13); }
    .field { margin-bottom: 16px; }
    .hint { color: var(--muted); font-size: 13px; margin-top: 8px; }
    .error { color: var(--danger); font-size: 14px; min-height: 22px; margin: 8px 0 0; text-align: center; }
    .warn-box { margin-top: 18px; padding: 13px; border-radius: 16px; background: #fff6df; color: #7a5a19; font-size: 13px; }

    .app { width: min(100%, var(--max)); margin: 0 auto; padding: 28px 20px 54px; }
    .hero-row { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 22px 0 24px; }
    .hero-row h1 { font-size: clamp(28px, 4vw, 46px); }
    .hero-row p { color: var(--muted); margin: 8px 0 0; }
    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    .stat {
      padding: 20px;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(104,135,104,.14);
      box-shadow: 0 16px 36px rgba(40,61,44,.07);
    }
    .stat span { display: block; color: var(--muted); font-size: 14px; }
    .stat strong { display: block; font-family: "Noto Serif TC", serif; color: var(--green-900); font-size: 34px; margin-top: 4px; }
    .toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 0 0 18px; }
    .toolbar input { max-width: 340px; background: rgba(255,255,255,.78); }
    .layout { display: grid; grid-template-columns: 360px 1fr; gap: 20px; align-items: start; }
    .panel {
      border-radius: var(--radius-xl);
      background: rgba(255,255,255,.84);
      border: 1px solid rgba(104,135,104,.14);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-head { padding: 22px 24px; border-bottom: 1px solid rgba(104,135,104,.13); display: flex; justify-content: space-between; gap: 14px; align-items: center; }
    .panel-head h2 { font-size: 24px; }
    .customer-list { max-height: 680px; overflow: auto; padding: 12px; }
    .customer-card {
      width: 100%;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 20px;
      background: transparent;
      padding: 16px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: .2s ease;
    }
    .customer-card:hover, .customer-card.active { background: var(--green-100); border-color: rgba(104,135,104,.20); }
    .customer-card h3 { font-size: 20px; display: flex; justify-content: space-between; gap: 8px; }
    .customer-card p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
    .mini-meta { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .tag { display: inline-flex; align-items: center; border-radius: 999px; background: rgba(255,255,255,.75); color: var(--green-700); padding: 4px 9px; font-size: 12px; font-weight: 700; }

    .detail-empty { padding: 58px 26px; text-align: center; color: var(--muted); }
    .detail-body { padding: 24px; }
    .profile { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 22px; }
    .profile-item { padding: 15px; border-radius: 18px; background: #fbfaf5; border: 1px solid rgba(104,135,104,.12); }
    .profile-item span { display: block; color: var(--muted); font-size: 13px; }
    .profile-item strong { display: block; color: var(--green-900); margin-top: 4px; }
    .visit-list { display: grid; gap: 14px; }
    .visit {
      padding: 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(238,244,234,.88), rgba(255,255,255,.88));
      border-left: 5px solid var(--green-600);
    }
    .visit-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .visit h4 { font-size: 20px; }
    .visit-price { color: var(--gold); font-weight: 900; font-size: 21px; font-family: "Noto Serif TC", serif; }
    .visit-meta { color: var(--muted); font-size: 14px; margin: 8px 0 12px; }
    .parts { display: flex; flex-wrap: wrap; gap: 7px; margin: 10px 0 14px; }
    .part { border-radius: 999px; background: white; color: var(--green-700); padding: 4px 10px; font-size: 13px; font-weight: 700; }
    .note-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .note { padding: 12px; border-radius: 15px; background: rgba(255,255,255,.72); }
    .note b { color: var(--green-800); display: block; margin-bottom: 4px; font-size: 13px; }
    .note p { margin: 0; color: #526052; font-size: 14px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(31,52,40,.44); display: grid; place-items: center; padding: 20px; }
    .modal { width: min(100%, 760px); max-height: min(92vh, 860px); overflow: auto; border-radius: var(--radius-xl); background: white; box-shadow: var(--shadow); }
    .modal form { padding: 24px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; flex-wrap: wrap; }

    @media (max-width: 980px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .layout { grid-template-columns: 1fr; }
      .customer-list { max-height: none; }
      .profile { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 620px) {
      .topbar-inner, .hero-row, .visit-top { align-items: flex-start; flex-direction: column; }
      .stats, .profile, .note-grid, .form-grid { grid-template-columns: 1fr; }
      .modal form, .detail-body, .panel-head, .login-card { padding: 20px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html" aria-label="回到清郁官網">
        <span class="brand-mark">清</span>
        <span>清郁 CRM<small>QING YU INTERNAL</small></span>
      </a>
      <div class="top-actions">
        <a class="btn" href="index.html">回官網</a>
        <button id="logoutBtn" class="btn btn-danger hidden" type="button">登出</button>
      </div>
    </div>
  </header>

  <main>
    <section id="loginView" class="login-shell">
      <div class="login-card">
        <h1>管理者登入</h1>
        <p>清郁內部客戶管理系統</p>
        <div class="field">
          <label for="adminId">帳號</label>
          <input id="adminId" type="text" autocomplete="username" placeholder="請輸入管理者帳號" value="admin">
        </div>
        <div class="field">
          <label for="adminPassword">密碼</label>
          <input id="adminPassword" type="password" autocomplete="current-password" placeholder="請輸入管理者密碼" value="0000">
          <div class="hint">示範帳密：admin / 0000</div>
        </div>
        <button id="loginBtn" class="btn btn-primary" type="button" style="width:100%">登入 CRM</button>
        <div id="loginError" class="error"></div>
        <div class="warn-box">此版本為 GitHub Pages 靜態示範版，資料儲存在此瀏覽器的 localStorage。正式營運請改用真正資料庫與後端登入。</div>
      </div>
    </section>

    <section id="appView" class="app hidden">
      <div class="hero-row">
        <div>
          <h1>客戶管理</h1>
          <p>內部 CRM：顧客資料、來訪紀錄、消費與追蹤建議。</p>
        </div>
        <button id="addVisitTopBtn" class="btn btn-primary" type="button">新增施作紀錄</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <input id="searchInput" type="search" placeholder="搜尋姓名、電話、服務或備註...">
        <button id="resetDemoBtn" class="btn btn-danger btn-small" type="button">重置示範資料</button>
      </div>

      <div class="layout">
        <aside class="panel">
          <div class="panel-head"><h2>客戶列表</h2><span id="customerCount" class="tag"></span></div>
          <div id="customerList" class="customer-list"></div>
        </aside>

        <section class="panel">
          <div class="panel-head">
            <h2 id="detailTitle">客戶詳細紀錄</h2>
            <button id="addVisitBtn" class="btn btn-primary btn-small" type="button">新增紀錄</button>
          </div>
          <div id="detailArea" class="detail-body"></div>
        </section>
      </div>
    </section>
  </main>

  <div id="modal" class="modal-backdrop hidden" role="dialog" aria-modal="true" aria-label="新增施作紀錄">
    <div class="modal">
      <div class="panel-head">
        <h2>新增施作紀錄</h2>
        <button id="closeModalBtn" class="btn btn-small" type="button">關閉</button>
      </div>
      <form id="visitForm">
        <div class="form-grid">
          <div class="field">
            <label for="visitCustomer">客戶</label>
            <select id="visitCustomer" required></select>
          </div>
          <div class="field">
            <label for="visitService">服務項目</label>
            <select id="visitService" required>
              <option>專業牛角鬆筋</option>
              <option>砭石舒壓療程</option>
              <option>客製化全身調理</option>
              <option>全身紓壓</option>
              <option>下肢紓壓</option>
            </select>
          </div>
          <div class="field">
            <label for="visitDate">日期</label>
            <input id="visitDate" type="date" required>
          </div>
          <div class="field">
            <label for="visitTime">時間</label>
            <input id="visitTime" type="time" required>
          </div>
          <div class="field">
            <label for="visitDuration">時長（分鐘）</label>
            <input id="visitDuration" type="number" min="10" step="5" value="60" required>
          </div>
          <div class="field">
            <label for="visitPrice">金額</label>
            <input id="visitPrice" type="number" min="0" step="100" value="1200" required>
          </div>
          <div class="field full">
            <label for="visitParts">施作部位（用逗號分隔）</label>
            <input id="visitParts" type="text" placeholder="肩頸, 腰部, 腿部" required>
          </div>
          <div class="field full">
            <label for="visitNotes">施作紀錄</label>
            <textarea id="visitNotes" placeholder="例如：肩頸緊繃、右側斜方肌需加強..." required></textarea>
          </div>
          <div class="field full">
            <label for="visitFollowUp">追蹤建議</label>
            <textarea id="visitFollowUp" placeholder="例如：建議下次加強肩頸，平時搭配伸展。"></textarea>
          </div>
        </div>
        <div class="modal-actions">
          <button class="btn" id="cancelModalBtn" type="button">取消</button>
          <button class="btn btn-primary" type="submit">儲存紀錄</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'qingyu-crm-demo-v1';
    const SESSION_KEY = 'qingyu-crm-auth';
    const users = { admin: { name: '店家', password: '0000', role: 'admin' } };
    const demoData = {
      customer1: {
        name: '小王', phone: '0912345678', totalVisits: 12, totalSpent: 2400, rewardPoints: 400,
        visits: [
          { date: '2024-12-03', time: '14:30', service: '全身紓壓', duration: 90, price: 2000, bodyParts: ['肩頸', '腰部', '腿部'], notes: '頸椎疼痛，需要加強肩頸', followUp: '建議每週來一次' },
          { date: '2024-11-29', time: '10:00', service: '上肢紓壓', duration: 60, price: 1200, bodyParts: ['肩頸', '手臂'], notes: '最近工作壓力大，肩膀特別緊', followUp: '持續追蹤肩膀狀況' },
          { date: '2024-11-24', time: '15:45', service: '全身紓壓', duration: 90, price: 2000, bodyParts: ['肩頸', '腰部', '腿部'], notes: '改善明顯，肩頸放鬆許多', followUp: '保持定期護理' }
        ]
      },
      customer2: {
        name: '小美', phone: '0987654321', totalVisits: 8, totalSpent: 8200, rewardPoints: 800,
        visits: [
          { date: '2024-12-02', time: '19:00', service: '全身深層紓壓', duration: 120, price: 2500, bodyParts: ['頭部', '肩頸', '腰部', '臀部', '腿部'], notes: '久坐族，下背部特別疼痛', followUp: '⚠️ 需要加強腰椎護理，建議搭配伸展運動' },
          { date: '2024-11-28', time: '18:30', service: '臉部舒壓+全身紓壓', duration: 120, price: 3000, bodyParts: ['頭部', '臉部', '肩頸', '腰部'], notes: '壓力大，睡眠不足', followUp: '建議定期進行頭部舒壓' }
        ]
      },
      customer3: {
        name: '阿傑', phone: '0911223344', totalVisits: 3, totalSpent: 1200, rewardPoints: 200,
        visits: [
          { date: '2024-12-01', time: '16:15', service: '下肢紓壓', duration: 60, price: 1200, bodyParts: ['腿部', '足部'], notes: '新客戶，運動愛好者，腿部肌肉緊繃', followUp: '首次來訪，評估初期' }
        ]
      }
    };

    let data = loadData();
    let selectedCustomerId = Object.keys(data)[0] || null;

    const $ = (id) => document.getElementById(id);
    const fmtMoney = (n) => '$' + Number(n || 0).toLocaleString('zh-TW');
    const today = () => new Date().toISOString().slice(0, 10);
    const nowTime = () => new Date().toTimeString().slice(0, 5);

    function loadData() {
      try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || structuredClone(demoData); }
      catch { return structuredClone(demoData); }
    }
    function saveData() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }
    function recalcCustomer(customer) {
      customer.totalVisits = customer.visits.length;
      customer.totalSpent = customer.visits.reduce((sum, v) => sum + Number(v.price || 0), 0);
      customer.rewardPoints = Math.floor(customer.totalSpent / 1000) * 100;
      customer.visits.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
    }
    function isAuthed() { return sessionStorage.getItem(SESSION_KEY) === '1'; }

    function showLogin() {
      $('loginView').classList.remove('hidden');
      $('appView').classList.add('hidden');
      $('logoutBtn').classList.add('hidden');
    }
    function showApp() {
      $('loginView').classList.add('hidden');
      $('appView').classList.remove('hidden');
      $('logoutBtn').classList.remove('hidden');
      render();
    }
    function login() {
      const id = $('adminId').value.trim();
      const password = $('adminPassword').value;
      const user = users[id];
      if (user && user.role === 'admin' && user.password === password) {
        sessionStorage.setItem(SESSION_KEY, '1');
        $('loginError').textContent = '';
        showApp();
      } else {
        $('loginError').textContent = '帳號或密碼錯誤';
      }
    }
    function logout() {
      sessionStorage.removeItem(SESSION_KEY);
      showLogin();
    }

    function customerEntries() {
      const q = $('searchInput')?.value.trim().toLowerCase() || '';
      return Object.entries(data).filter(([id, c]) => {
        const blob = [id, c.name, c.phone, ...c.visits.flatMap(v => [v.service, v.notes, v.followUp, ...v.bodyParts])].join(' ').toLowerCase();
        return !q || blob.includes(q);
      });
    }
    function renderStats(entries = Object.entries(data)) {
      const customers = entries.length;
      const totalVisits = entries.reduce((sum, [, c]) => sum + c.visits.length, 0);
      const totalSpent = entries.reduce((sum, [, c]) => sum + c.totalSpent, 0);
      const coupons = entries.reduce((sum, [, c]) => sum + Math.floor(c.rewardPoints / 100), 0);
      $('stats').innerHTML = `
        <div class="stat"><span>客戶數</span><strong>${customers}</strong></div>
        <div class="stat"><span>總來訪</span><strong>${totalVisits}</strong></div>
        <div class="stat"><span>累計消費</span><strong>${fmtMoney(totalSpent)}</strong></div>
        <div class="stat"><span>可用優惠券</span><strong>${coupons}</strong></div>
      `;
    }
    function renderCustomerList(entries) {
      $('customerCount').textContent = `${entries.length} 位`;
      if (!entries.some(([id]) => id === selectedCustomerId)) selectedCustomerId = entries[0]?.[0] || null;
      $('customerList').innerHTML = entries.map(([id, c]) => {
        const last = c.visits[0]?.date || '尚無紀錄';
        return `
          <button class="customer-card ${id === selectedCustomerId ? 'active' : ''}" data-customer-id="${id}" type="button">
            <h3>${c.name}<span class="tag">${id}</span></h3>
            <p>📞 ${c.phone}</p>
            <div class="mini-meta">
              <span class="tag">${c.visits.length} 次</span>
              <span class="tag">${fmtMoney(c.totalSpent)}</span>
              <span class="tag">最後 ${last}</span>
            </div>
          </button>
        `;
      }).join('') || '<div class="detail-empty">找不到符合條件的客戶。</div>';
      document.querySelectorAll('.customer-card').forEach(btn => btn.addEventListener('click', () => {
        selectedCustomerId = btn.dataset.customerId;
        render();
      }));
    }
    function renderDetail() {
      const c = selectedCustomerId ? data[selectedCustomerId] : null;
      if (!c) {
        $('detailTitle').textContent = '客戶詳細紀錄';
        $('detailArea').innerHTML = '<div class="detail-empty">請先選擇一位客戶。</div>';
        return;
      }
      $('detailTitle').textContent = `${c.name} - 詳細紀錄`;
      $('detailArea').innerHTML = `
        <div class="profile">
          <div class="profile-item"><span>姓名</span><strong>${c.name}</strong></div>
          <div class="profile-item"><span>電話</span><strong>${c.phone}</strong></div>
          <div class="profile-item"><span>來訪次數</span><strong>${c.visits.length} 次</strong></div>
          <div class="profile-item"><span>累計消費</span><strong>${fmtMoney(c.totalSpent)}</strong></div>
        </div>
        <div class="visit-list">
          ${c.visits.map(v => `
            <article class="visit">
              <div class="visit-top"><div><h4>${v.service}</h4><div class="visit-meta">📅 ${v.date}　🕐 ${v.time}　⏱️ ${v.duration} 分鐘</div></div><div class="visit-price">${fmtMoney(v.price)}</div></div>
              <div class="parts">${v.bodyParts.map(p => `<span class="part">${p}</span>`).join('')}</div>
              <div class="note-grid">
                <div class="note"><b>施作紀錄</b><p>${v.notes}</p></div>
                <div class="note"><b>追蹤建議</b><p>${v.followUp || '—'}</p></div>
              </div>
            </article>
          `).join('') || '<div class="detail-empty">尚無施作紀錄。</div>'}
        </div>
      `;
    }
    function render() {
      Object.values(data).forEach(recalcCustomer);
      saveData();
      const entries = customerEntries();
      renderStats(Object.entries(data));
      renderCustomerList(entries);
      renderDetail();
      renderCustomerOptions();
    }
    function renderCustomerOptions() {
      $('visitCustomer').innerHTML = Object.entries(data).map(([id, c]) => `<option value="${id}" ${id === selectedCustomerId ? 'selected' : ''}>${c.name}｜${c.phone}</option>`).join('');
    }

    function openModal() {
      if (!selectedCustomerId) return;
      renderCustomerOptions();
      $('visitCustomer').value = selectedCustomerId;
      $('visitDate').value = today();
      $('visitTime').value = nowTime();
      $('visitParts').value = '肩頸';
      $('visitNotes').value = '';
      $('visitFollowUp').value = '';
      $('modal').classList.remove('hidden');
      $('visitNotes').focus();
    }
    function closeModal() { $('modal').classList.add('hidden'); }
    function addVisit(event) {
      event.preventDefault();
      const id = $('visitCustomer').value;
      const visit = {
        date: $('visitDate').value,
        time: $('visitTime').value,
        service: $('visitService').value,
        duration: Number($('visitDuration').value),
        price: Number($('visitPrice').value),
        bodyParts: $('visitParts').value.split(/[,，、]/).map(s => s.trim()).filter(Boolean),
        notes: $('visitNotes').value.trim(),
        followUp: $('visitFollowUp').value.trim()
      };
      data[id].visits.unshift(visit);
      recalcCustomer(data[id]);
      selectedCustomerId = id;
      saveData();
      closeModal();
      render();
    }

    $('loginBtn').addEventListener('click', login);
    $('adminPassword').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('adminId').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(); });
    $('logoutBtn').addEventListener('click', logout);
    $('searchInput').addEventListener('input', render);
    $('addVisitBtn').addEventListener('click', openModal);
    $('addVisitTopBtn').addEventListener('click', openModal);
    $('closeModalBtn').addEventListener('click', closeModal);
    $('cancelModalBtn').addEventListener('click', closeModal);
    $('modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });
    $('visitForm').addEventListener('submit', addVisit);
    $('resetDemoBtn').addEventListener('click', () => {
      if (confirm('確定要重置示範資料？此瀏覽器新增的紀錄會被清除。')) {
        localStorage.removeItem(STORAGE_KEY);
        data = structuredClone(demoData);
        selectedCustomerId = Object.keys(data)[0];
        render();
      }
    });

    if (isAuthed()) showApp(); else showLogin();
  </script>
</body>
</html>
